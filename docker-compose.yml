services:
  # Base de datos PostgreSQL 16 con SSL activado
  postgres:
    image: postgres:16
    container_name: pg-sensores
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}   # del archivo .env; admin123 si no existe
      POSTGRES_DB: smartfactory
    # Activa SSL con el certificado autofirmado que trae la imagen
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    ports:
      - "5432:5432"
    volumes:
      # Crea la tabla y los datos iniciales la primera vez que arranca
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartfactory"]
      interval: 3s
      retries: 10

  # Aplicación Java (JDK 17 + Maven dentro del contenedor, no requiere instalarlos)
  app:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-admin123}   # del archivo .env; admin123 si no existe
      DB_SSLMODE: require
    volumes:
      - ./:/app
      - m2:/root/.m2          # guarda el driver descargado para no bajarlo cada vez
    command: mvn -q compile exec:java
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  m2:
